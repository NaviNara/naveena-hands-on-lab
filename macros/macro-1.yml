fileVersion: 1
id: "1"
macroString: |
  {% macro clean_phone_number(column_name) %}
      CASE
          WHEN LENGTH(REGEXP_REPLACE({{ column_name }}, '[^0-9]', '')) = 11
               AND SUBSTR(REGEXP_REPLACE({{ column_name }}, '[^0-9]', ''), 1, 1) = '1'
          THEN SUBSTR(REGEXP_REPLACE({{ column_name }}, '[^0-9]', ''), 2)
          ELSE REGEXP_REPLACE({{ column_name }}, '[^0-9]', '')
      END
  {% endmacro %}
name: macro
type: Macro
